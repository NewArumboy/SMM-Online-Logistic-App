<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMM Online Logistic</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f4f7f6; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <!-- กรอบที่จะดึง Web App มาแสดง -->
    <iframe id="appFrame"></iframe>

    <script>
        // 🔴 1. นำลิงก์ Web App (ที่ลงท้ายด้วย /exec) มาวางในเครื่องหมายคำพูดด้านล่างนี้
        const gasUrl = "https://script.google.com/macros/s/AKfycbz7hY28DB64-oYNV3JGuWwSq8gQ1ZtN4E4AnuRmHxbazxnSbjiJ2F1MS0x7F59FgizOzg/exec";
        
        // 2. โค้ดตัวนี้จะดึงคำสั่งจาก LINE (เช่น ?page=driver) มาต่อท้ายให้อัตโนมัติ
        const queryParams = window.location.search;
        document.getElementById('appFrame').src = gasUrl + queryParams;
    </script>
</body>
</html>
