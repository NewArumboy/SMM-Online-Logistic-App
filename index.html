<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMM Online Logistic</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f4f7f6; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <!-- กรอบที่จะดึง Web App มาแสดง -->
    <iframe id="appFrame"></iframe>

    <script>
        // 1. ลิงก์ Web App
        const gasUrl = "https://script.google.com/macros/s/AKfycbzy46-GYRi55BlEbO7SJOJgyBDJaE0T4SioDzwXQw-HEtCPOumi57jQSzJyU04p6T7KnA/exec";
        
        // 2. โค้ดส่วนนี้จะดึงคำสั่งจาก LINE (เช่น ?page=driver) มาต่อท้ายให้อัตโนมัติ
        const queryParams = window.location.search;
        document.getElementById('appFrame').src = gasUrl + queryParams;
    </script>
</body>
</html>
